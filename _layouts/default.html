
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title | escape }} |
    {% endif %}
    {{ site.title | escape }}
  </title>

  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <link rel="canonical"
        href="{{ page.url | absolute_url }}">
 
  <!-- GOOGLE SEO & DISCOVER -->
  <meta name="robots"
        content="index, follow, max-image-preview:large">

  <!-- OPEN GRAPH -->
  <meta property="og:locale" content="id_ID">

  <meta property="og:site_name"
        content="{{ site.title | escape }}">

  <meta property="og:type"
        content="{% if page.date %}article{% else %}website{% endif %}">

  <meta property="og:title"
        content="{{ page.title | default: site.title | escape }}">

  <meta property="og:description"
        content="{{ page.description | default: site.description | escape }}">

  <meta property="og:url"
        content="{{ page.url | absolute_url }}">

  {% if page.image %}
  <meta property="og:image"
        content="{{ page.image | absolute_url }}">
  {% endif %}

  <!-- ARTICLE STRUCTURED DATA -->
  {% if page.date %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    {% if page.last_modified_at %}
    "dateModified": {{ page.last_modified_at | date_to_xmlschema | jsonify }},
    {% endif %}
    {% if page.image %}
    "image": {{ page.image | absolute_url | jsonify }},
    {% endif %}
    "author": {
      "@type": "Organization",
      "name": {{ page.author | default: site.title | jsonify }}
    },
    "publisher": {
      "@type": "Organization",
      "name": {{ site.title | jsonify }}
    },
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": {{ page.url | absolute_url | jsonify }}
    }
  }
  </script>
  {% endif %}

  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202938;
      line-height: 1.7;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
    }

    .site-header {
      background: #17365d;
      padding: 15px 0;
    }

    .site-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: white;
    }

    .site-logo {
      width: 180px;
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    nav a {
      color: white;
      margin-right: 15px;
      text-decoration: none;
      font-weight: 500;
    }

    main {
      padding-top: 35px;
      padding-bottom: 50px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card, .post {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 15px #00000012;
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
    }

    .card h2 {
      font-size: 19px;
      line-height: 1.4;
      margin: 0 0 12px;
    }

    .card a {
      color: #17365d;
      text-decoration: none;
    }

    .post {
      padding: 30px;
    }

    .post-image {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .meta {
      color: #64748b;
      font-size: 14px;
    }

    footer {
      background: #17365d;
      color: white;
      text-align: center;
      padding: 24px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .post {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  {% include header.html %}

  <main class="container">
    {{ content }}
  </main>

  <footer>
    &copy; {{ 'now' | date: '%Y' }}
    Berita Update Byte
  </footer>

</body>
</html>
