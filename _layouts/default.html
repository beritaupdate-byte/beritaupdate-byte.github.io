
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title | escape }} |
    {% endif %}
    {{ site.title | escape }}
  </title>

  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <link rel="canonical"
        href="{{ page.url | absolute_url }}">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #202938;
      line-height: 1.7;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px;
    }

    .site-header {
      background: #17365d;
      padding: 15px 0;
    }

    .site-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: white;
    }

    .site-logo {
      width: 180px;
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }

    nav a {
      color: white;
      margin-right: 15px;
      text-decoration: none;
      font-weight: 500;
    }

    main {
      padding-top: 35px;
      padding-bottom: 50px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card, .post {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 15px #00000012;
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .card-body {
      padding: 20px;
    }

    .card h2 {
      font-size: 19px;
      line-height: 1.4;
      margin: 0 0 12px;
    }

    .card a {
      color: #17365d;
      text-decoration: none;
    }

    .post {
      padding: 30px;
    }

    .post-image {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .meta {
      color: #64748b;
      font-size: 14px;
    }

    footer {
      background: #17365d;
      color: white;
      text-align: center;
      padding: 24px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .post {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  {% include header.html %}

  <main class="container">
    {{ content }}
  </main>

  <footer>
    &copy; {{ 'now' | date: '%Y' }}
    Berita Update Byte
  </footer>

</body>
</html>
