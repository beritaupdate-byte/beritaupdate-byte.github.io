
---
layout: default
---

<article class="post">

  <h1>{{ page.title | escape }}</h1>

  <p class="meta">
    Oleh {{ page.author | default: site.title }} |
    {{ page.date | date: "%d %B %Y" }} |
    {{ page.categories | join: ", " }}
  </p>

  {% if page.image %}
  <img
    class="post-image"
    src="{{ page.image | relative_url }}"
    alt="{{ page.title | escape }}"
    loading="lazy">
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  {% unless page.hide_buttons %}
  <div class="post-actions">
    <button onclick="window.print()">
      Cetak Artikel
    </button>
  </div>
  {% endunless %}

</article>
