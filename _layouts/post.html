
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>{{ page.title | escape }}</title>

  <meta name="description"
        content="{{ page.description | escape }}">

  <link rel="canonical"
        href="{{ page.url | absolute_url }}">
</head>
<body>
  <main>
    <article>
      <h1>{{ page.title }}</h1>

      <p>
        {{ page.author }} |
        {{ page.date | date: "%d-%m-%Y" }}
      </p>

      {% if page.image %}
      <img src="{{ page.image | relative_url }}"
           alt="{{ page.title | escape }}">
      {% endif %}

      {{ content }}
    </article>
  </main>
</body>
</html>
